<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title"       content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url"         content="{{ site.url }}{{ page.url }}">
  <meta property="og:type"        content="website">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>

  <!-- Google Analytics GA4 -->
  {% if jekyll.environment == 'production' %}
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8WDNH6KQ1T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8WDNH6KQ1T');
  </script>
  {% endif %}

  <!-- Prevent dark-mode flash -->
  <script>
    (function(){
      var s = localStorage.getItem('mwcl-theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
    })();
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<!-- ── Navigation ───────────────────────────────────────── -->
<nav class="nav" role="navigation" aria-label="主導覽">
  <div class="nav-inner">

    <div class="nav-logo">
      <a href="{{ '/' | relative_url }}">
        Michael Wei-Chih Liu
        <span class="zh">劉威志</span>
      </a>
    </div>

    <div class="nav-links" id="nav-links">
      <a href="{{ '/about' | relative_url }}">
        <span class="zh-label">關於我</span>
        <span class="en-label">About</span>
      </a>
      <a href="{{ '/research' | relative_url }}">
        <span class="zh-label">研究</span>
        <span class="en-label">Research</span>
      </a>
      <a href="{{ '/writing' | relative_url }}">
        <span class="zh-label">寫作</span>
        <span class="en-label">Writing</span>
      </a>
      <a href="{{ '/projects' | relative_url }}">
        <span class="zh-label">專案</span>
        <span class="en-label">Projects</span>
      </a>
      <a href="{{ '/connect' | relative_url }}">
        <span class="zh-label">聯絡</span>
        <span class="en-label">Connect</span>
      </a>
    </div>

    <div class="nav-controls">
      <button class="theme-toggle" id="theme-toggle" aria-label="切換深淺模式">🌙</button>
      <button class="nav-toggle"  id="nav-toggle"   aria-label="開啟選單" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</nav>

<!-- ── Main Content ─────────────────────────────────────── -->
<main>
  {{ content }}
</main>

<!-- ── Footer ───────────────────────────────────────────── -->
<footer class="footer">
  <div class="footer-inner">
    <p class="footer-copy">
      © {{ 'now' | date: "%Y" }} Michael Wei-Chih Liu 劉威志 ·
      <a href="https://michaelweichihliu.tw">michaelweichihliu.tw</a>
    </p>
    <nav class="footer-links" aria-label="頁腳導覽">
      <a href="{{ '/research' | relative_url }}">Research</a>
      <a href="{{ '/writing'  | relative_url }}">Writing</a>
      <a href="{{ '/connect'  | relative_url }}">Connect</a>
    </nav>
  </div>
</footer>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
