e": "領導者的親身實踐：決策制定中的人機協作經驗", "target": "大型語言模型模型選擇決策框架"}, {"source": "領導者的親身實踐：決策制定中的人機協作經驗", "target": "AI 時代的決策制定框架：人機協作的新模式"}, {"source": "領導者的親身實踐：決策制定中的人機協作經驗", "target": "AI 工作任務分配框架"}, {"source": "領導者的親身實踐：決策制定中的人機協作經驗", "target": "AI 代理工作流在辦公室的應用與流程改造"}, {"source": "領導者的親身實踐：決策制定中的人機協作經驗", "target": "人工智慧在臨床醫事人員訓練中的挑戰"}, {"source": "領導者的親身實踐：決策制定中的人機協作經驗", "target": "決策者的親身實踐：為什麼領導者必須親手體驗 AI 工具"}];
const COLORS = {"HTA醫療": "#3b82f6", "AI科技": "#22c55e", "旅遊": "#eab308", "社會文化": "#ec4899", "其他": "#9ca3af"};
const width = window.innerWidth, height = window.innerHeight;
let showLabels = true;

const svg = d3.select("#graph");
const g   = svg.append("g");

// 縮放與平移
const zoom = d3.zoom().scaleExtent([0.1, 8])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// 力模擬
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => 80))
  .force("charge", d3.forceManyBody().strength(-200))
  .force("center", d3.forceCenter(width/2, height/2))
  .force("collision", d3.forceCollide().radius(d => nodeR(d) + 4));

function nodeR(d) { return Math.max(5, Math.min(28, 5 + d.deg * 2.5)); }

// 邊
const link = g.append("g").selectAll("line")
  .data(links).join("line").attr("class", "link");

// 節點
const node = g.append("g").selectAll("circle")
  .data(nodes).join("circle")
  .attr("class", "node")
  .attr("r",    d => nodeR(d))
  .attr("fill", d => COLORS[d.group] || "#9ca3af")
  .attr("fill-opacity", 0.85)
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end",   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
  .on("mouseover", (e,d) => {
    const tip = document.getElementById("tooltip");
    tip.style.display = "block";
    tip.style.left = (e.clientX+14)+"px";
    tip.style.top  = (e.clientY-10)+"px";
    tip.innerHTML = `<strong>${d.id}</strong><br>主題：${d.group}<br>連結數：${d.deg}（被連 ${d.in} / 連出 ${d.out}）`;
  })
  .on("mousemove", e => {
    document.getElementById("tooltip").style.left = (e.clientX+14)+"px";
    document.getElementById("tooltip").style.top  = (e.clientY-10)+"px";
  })
  .on("mouseout", () => document.getElementById("tooltip").style.display="none");

// 標籤（只顯示有連結的節點）
const label = g.append("g").selectAll("text")
  .data(nodes.filter(d => d.deg > 0)).join("text")
  .attr("class", "label")
  .attr("dy", d => -nodeR(d)-3)
  .attr("text-anchor", "middle")
  .text(d => d.id.length > 18 ? d.id.slice(0,18)+"…" : d.id);

sim.on("tick", () => {
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("cx",d=>d.x).attr("cy",d=>d.y);
  label.attr("x",d=>d.x).attr("y",d=>d.y);
});

function resetZoom() {
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
}
function toggleLabels() {
  showLabels = !showLabels;
  label.style("display", showLabels ? null : "none");
}
</script>
